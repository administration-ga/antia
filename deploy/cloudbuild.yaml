# Construction d'une application du moteur par Cloud Build, en contexte
# ECOSYSTEMES (liste blanche : deploy/gcloudignore). Appelé par
# scripts/deploy-app.mjs, qui fournit les substitutions depuis le catalogue et
# l'environnement de la machine qui publie (jamais depuis le dépôt).
# Hébergement (Cloud Run ou Vercel) : arbitrage A5, non tranché.
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - ${_DOCKERFILE}
      - --build-arg
      - NEXT_PUBLIC_CONVEX_URL=${_NEXT_PUBLIC_CONVEX_URL}
      - --build-arg
      - NEXT_PUBLIC_SITE_URL=${_NEXT_PUBLIC_SITE_URL}
      - --build-arg
      - NEXT_PUBLIC_BUILD_SHA=${_NEXT_PUBLIC_BUILD_SHA}
      - -t
      - ${_IMAGE}
      - .
images:
  - ${_IMAGE}
options:
  machineType: E2_HIGHCPU_8
timeout: 1800s
